<script>(async function(){
  const $=s=>document.querySelector(s);
  const data=window.SITE_DATA||await fetch("/api/site").then(r=>r.json());
  const app=$("#app");
  document.title=`${data.brand||"teamspirit"} - Custom Uniform Studio`;
  const defaults=[
    ["custom","CUSTOM","Custom order uniforms and team identity design."],
    ["football-wear","FOOTBALL WEAR","Match kits, shorts, socks and football gear."],
    ["team-kit","TEAM KIT","Full team packages with front and back uniform views."],
    ["training","TRAINING","Half zips, drill tops, jackets and warm-up wear."],
    ["kids","KIDS","Youth and academy team kits."]
  ];
  data.categories=(data.categories&&data.categories.length?data.categories:defaults.map(([id,name,desc])=>({id,name,desc})));

  const visibleCategoryIds=new Set(data.categories.map(c=>c.id));
  const colors=["black","white","red","blue","yellow","green","pink","navy","purple","orange"];
  const bg=[
    "linear-gradient(135deg,#151515,#3c3c3c)",
    "linear-gradient(135deg,#f5f5f5,#cfcfcf)",
    "linear-gradient(135deg,#610000,#d71818)",
    "linear-gradient(135deg,#061d66,#1f67e7)",
    "linear-gradient(135deg,#6d5200,#ffd400)",
    "linear-gradient(135deg,#063c24,#2da868)",
    "linear-gradient(135deg,#6a174c,#ff83c6)",
    "linear-gradient(135deg,#07162b,#183b78)",
    "linear-gradient(135deg,#321158,#8550d6)",
    "linear-gradient(135deg,#7a3100,#ff8a1f)"
  ];
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const money=p=>p.oldPrice?`<span class="old">${esc(p.oldPrice)}</span>${p.sale?`<span class="sale">${esc(p.sale)}</span>`:""}${esc(p.price)}`:esc(p.price);
  const slug=s=>String(s||"").toLowerCase().trim().replace(/\s+/g,"-");
  const jersey=(name,color,i,back=false)=>{
    const num=(23+i)%89+10, main=back?`HONG\\n${num}`:name.split(" ")[0].slice(0,10);
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#111"/></linearGradient><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M0 56 56 0M-14 14 14-14M42 70 70 42" stroke="rgba(255,255,255,.13)" stroke-width="8"/></pattern></defs><rect width="900" height="900" fill="url(#g)"/><rect width="900" height="900" fill="url(#p)"/><text x="640" y="150" fill="rgba(255,255,255,.12)" font-size="95" font-family="Arial" font-weight="900">TEAM</text><path d="M260 180 340 125h220l80 55 125 88-70 130-86-42v310H291V356l-86 42-70-130z" fill="rgba(255,255,255,.92)" stroke="#111" stroke-width="8"/><path d="M340 125c30 55 190 55 220 0" fill="none" stroke="#111" stroke-width="11"/><path d="M307 220h286M291 356h318M291 520h318" stroke="rgba(0,0,0,.12)" stroke-width="22"/><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="${back?72:52}" font-weight="900" fill="#111">${main}</text><text x="450" y="500" text-anchor="middle" font-family="Arial" font-size="92" font-weight="900" fill="#111">${back?num:"SPIRIT"}</text><text x="450" y="650" text-anchor="middle" font-family="Arial" font-size="36" font-weight="900" fill="#111">teamspirit</text></svg>`)}`;
  };
  const demoProducts=()=>{

      }
    });
    return out;
  };
  const products=()=>[...(data.products||[])].filter(p=>p&&p.id&&p.image&&visibleCategoryIds.has(p.category));
  const productBy=id=>products().find(p=>p.id===id)||products()[0];
  const productsIn=cat=>products().filter(p=>p.category===cat);

    return imgs.length?imgs:[data.heroImage].filter(Boolean);
  };
  function iconSvg(key,label){

    if(k.includes("gallery")||label.includes("갤러리"))return `<svg ${common}><rect x="18" y="24" width="54" height="36" stroke="#111" stroke-width="3"/><path d="M26 52 38 40l10 9 8-7 10 10M28 68h34M34 76h22" stroke="#111" stroke-width="3"/><circle cx="57" cy="34" r="4" fill="#111"/></svg>`;
    if(k.includes("font")||label.includes("폰트"))return `<svg ${common}><path d="M15 62h28V28H30v34M49 62h26M62 62V25M53 25h18" stroke="#111" stroke-width="3"/><path d="M18 20h22M18 28h16" stroke="#ff2b2b" stroke-width="5"/><path d="M18 36h20" stroke="#ffd400" stroke-width="5"/><path d="M18 44h18" stroke="#315bff" stroke-width="5"/></svg>`;
    if(k.includes("faq")||label.includes("FAQ"))return `<svg ${common}><rect x="14" y="22" width="62" height="38" rx="4" stroke="#111" stroke-width="3"/><path d="M30 60v12l14-12" stroke="#111" stroke-width="3"/><text x="45" y="48" text-anchor="middle" font-size="22" font-family="Arial" font-weight="900" fill="#111">FAQ</text></svg>`;
    if(k.includes("method")||label.includes("방법"))return `<svg ${common}><path d="M58 18c-10 3-16 10-18 22M40 40c-12-5-21 1-26 12 10 4 21 0 26-12z" stroke="#111" stroke-width="3"/><circle cx="60" cy="58" r="15" stroke="#111" stroke-width="3"/><path d="M60 49v10M60 66h.1" stroke="#111" stroke-width="4"/><circle cx="23" cy="56" r="4" fill="#ff2b2b"/><circle cx="35" cy="62" r="4" fill="#315bff"/><circle cx="24" cy="68" r="4" fill="#ffd400"/></svg>`;
    return `<svg ${common}><path d="M57 14c-8 4-13 11-14 23M43 37C28 30 15 38 11 53c15 8 32 1 32-16z" stroke="#111" stroke-width="3"/><ellipse cx="39" cy="58" rx="29" ry="18" stroke="#111" stroke-width="3"/><circle cx="24" cy="55" r="4" fill="#ff2b2b"/><circle cx="36" cy="51" r="4" fill="#ffd400"/><circle cx="48" cy="55" r="4" fill="#315bff"/><circle cx="57" cy="64" r="4" fill="#7c3cff"/><circle cx="31" cy="66" r="4" fill="#00a85a"/></svg>`;
  }
  function header(){
    const brand=data.logo?`<img class="brand-logo" src="${esc(data.logo)}" alt="${esc(data.brand||"teamspirit")}">`:`${esc(data.brand||"teamspirit")}`;
    return `<header class="head"><div class="top">${esc(data.topNotice)}</div><div class="util"><span>카카오톡 상담</span><span>로그인</span><span>회원가입</span><span>주문서확인</span><span>한국어</span></div><div class="nav"><a class="brand" onclick="showHome()">${brand}</a><nav class="menu">${data.categories.map(c=>`<button onclick="openCategory('${c.id}')">${esc(c.name)}</button>`).join("")}</nav><div class="search"><input id="searchInput" placeholder="검색"><button onclick="runSearch()">⌕</button></div></div></header>`;
  }
  function card(p,cart=false){
    const hover=p.hoverImage||p.image, cat=categoryMap[p.category]?.name||p.category||"";
    return `<article class="card" data-id="${esc(p.id)}"><div class="pic" onclick="openProduct('${esc(p.id)}')"><img class="main" src="${p.image}" alt="${esc(p.name)}"><img class="hover" src="${hover}" alt="${esc(p.name)} back"><div class="tools"><button class="tool" onclick="event.stopPropagation();toggleWish(this)">♡</button><button class="tool" onclick="event.stopPropagation();openProduct('${esc(p.id)}')">⌕</button></div></div><div class="name">${esc(p.name||"Untitled product")}</div><div class="sub">${esc(cat)} · 사용후기 : ${p.demo?0:1}</div><div class="price">${money(p)}</div>${cart?'<button class="cart" onclick="addCart()">장바구니담기</button>':""}</article>`;
  }
  window.openProduct=id=>{location.hash="product/"+id;render()};
  window.openCategory=id=>{location.hash="category/"+id;render()};
  window.openGuide=id=>{location.hash="guide/"+id;render()};
  window.showHome=()=>{location.hash="";render()};

    const list=(data.shortcuts||[]).map((x,i)=>({...x,id:x.id||`guide-${i}`}));
    return `<section class="shortcuts">${list.map(x=>`<button class="shortcut" onclick="openGuide('${x.id}')"><span class="ico">${iconSvg(x.iconKey||x.icon,x.title)}</span><span>${esc(x.title)}</span></button>`).join("")}</section>`;
  }

  function detail(id){
    const p=productBy(id), extraImages=(p.gallery||[]).filter(Boolean), gallery=[p.image,p.hoverImage,...extraImages].filter(Boolean), related=products().filter(x=>x.category===p.category&&x.id!==p.id).slice(0,3);
    app.innerHTML=`${header()}<main class="detail"><button class="back" onclick="openCategory('${p.category}')">← 목록으로</button><section class="detail-top"><div><div class="gallery-main"><img id="mainImg" src="${gallery[0]}"></div><div class="thumbs">${gallery.map((g,i)=>`<button class="thumb ${i===0?"active":""}" onclick="document.getElementById('mainImg').src='${g}';document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')"><img src="${g}"></button>`).join("")}</div></div><aside class="info"><h1>${esc(p.name)}</h1><div class="big-price">${money(p)}</div><div class="meta"><div><b>카테고리</b><span>${esc(categoryMap[p.category]?.name||p.category)}</span></div><div><b>배송방법</b><span>택배</span></div><div><b>배송비</b><span>3,000원 / 50,000원 이상 무료</span></div></div><b>사이즈</b><div class="sizes">${sizeButtons(p)}</div><div class="upsell"><b>다른 고객이 함께 본 상품이에요</b><p>50,000원 이상 구매 시 무료배송</p><div class="progress"><span></span></div><div class="mini-row">${related.map(r=>`<div class="mini" onclick="openProduct('${r.id}')"><img src="${r.image}"><p>${esc(r.name)}</p><b>${esc(r.price)}</b></div>`).join("")}</div></div><div class="total"><span>총 상품금액</span><span>${esc(p.price)}</span></div><div class="buy-row"><button class="buy" onclick="openOrder('${p.id}')">바로 구매</button><button class="bag" onclick="addCart()">장바구니</button></div><div class="pay"><div class="npay">N Pay 구매</div><div class="kpay" onclick="openOrder('${p.id}')">카카오톡 주문</div></div></aside></section><nav class="tabs-bar"><button class="active">제품상세</button><button>상품구매안내</button><button>리뷰</button><button>Q&A</button></nav><section class="detail-section"><div class="bundle"><h2>지금 보고있는 ${esc(p.name)} 상품과 세트 상품을 함께 구매해 보세요!</h2></div><div class="coupon">우리, 친구해요! 카카오톡 플친 하고 2,000원 쿠폰 받자!</div><p class="notice">해당 제품은 주문제작 상품입니다.<br>주문 이후 약 3주~4주 정도 소요됩니다.</p>${extraImages.length?`<div class="product-extra-images"><h2>제품 추가 이미지</h2><p>상세 컷, 착용 컷, 소재 컷을 추가해 상품 경험을 더 풍부하게 보여줍니다.</p><div class="extra-image-list">${extraImages.map(img=>`<img src="${img}" alt="${esc(p.name)} detail image">`).join("")}</div></div>`:""}${sizeTable(p)}<h2>상품구매안내</h2><table class="purchase-table"><tr><th>결제 안내</th><td>고객 결제 완료 후 주문 제작이 진행됩니다.</td></tr><tr><th>배송 안내</th><td>전국지역 / 평균 3일~7일, 주문제작 상품은 별도 소요됩니다.</td></tr><tr><th>교환/반품 안내</th><td>주문제작 상품은 제작 진행 이후 취소가 제한될 수 있습니다.</td></tr></table><h2>상품 리뷰</h2><div class="review-card"><div class="stars">★★★★★</div><p>${esc(data.reviewText)}</p><img class="review-photo" src="${p.hoverImage||p.image}"></div><h2>상품 Q&A</h2><div class="qna">${esc(data.qnaText)}</div></section></main>${footer()}`;
  }
  function footer(){return `<footer class="footer"><div class="wrap foot"><div><h3>${esc(data.brand)}</h3><p>${esc(data.footerText)}</p><p>Copyright ${esc(data.brand)}. All rights reserved.</p></div><div><h4>고객센터</h4><h3>${esc(data.footerPhone)}</h3><p>평일 10:00-17:00</p></div><div><h4>커뮤니티</h4><p>NOTICE<br>EVENT<br>Q&A<br>REVIEW</p></div></div></footer>`}
  function render(){
    const h=decodeURIComponent(location.hash.slice(1));
    if(h.startsWith("product/"))detail(h.split("/")[1]);
    else if(h.startsWith("category/"))categoryPage(h.split("/")[1]);
    else if(h.startsWith("search/"))categoryPage("search",h.slice(7));
    else if(h.startsWith("guide/"))guidePage(h.split("/")[1]);
    else home();
    if(!window.SITE_DATA&&!document.querySelector(".edit-page-link")){const a=document.createElement("a");a.className="edit-page-link";a.href="/editor";a.textContent="Sửa trang này";document.body.appendChild(a)}
  }
  addEventListener("hashchange",render);render();
})();



</script>
</body>
</html>
